        <path fill="#1b1612" d="m 60,90 v 115 h 24 q 32,0 32,-34 V 125 Q 116,90 84,90 Z"/>
      </g>
      <g id="drj-shading" inkscape:groupmode="layer" inkscape:label="J lower shading">
        <g transform="translate(-67 0)">
          <path clip-path="url(#drj-j-clip)" fill="#c59d61" d="m 388,239 q 98,17 200,-9 l 2,64 H 388 Z"/>
        </g>
      </g>
    </g>
    <g id="drj-water" inkscape:groupmode="layer" inkscape:label="Water" stroke-linejoin="round">
      <path fill="#5d7d90" stroke="#1b1612" stroke-width="9" d="M28,346 Q120,366 210,356 Q300,346 360,348 Q410,348 435,330 Q450,315 458,298 Q478,312 472,340 L492,332 Q484,385 415,405 Q310,432 180,405 Q100,392 36,382 L110,378 Q60,368 28,346 Z"/>
      <g clip-path="url(#drj-water-clip)">
