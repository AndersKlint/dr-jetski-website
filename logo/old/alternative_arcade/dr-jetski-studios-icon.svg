    </clipPath>
  </defs>
  <g transform="translate(256 256) scale(.92) translate(-256 -256)">
    <g transform="translate(60 80) skewX(-8) scale(.83 1.05)" stroke-linejoin="round" stroke-linecap="round">
      <g id="drj-outlines" inkscape:groupmode="layer" inkscape:label="Outlines">
        <use href="#drj-lettering" fill="#1b1612" stroke="#f2dab6" stroke-width="44"/>
        <use href="#drj-lettering" fill="#1b1612" stroke="#1b1612" stroke-width="30"/>
      </g>
      <g id="drj-faces" inkscape:groupmode="layer" inkscape:label="Dr.J lettering">
        <use href="#drj-doctor" fill="#cc8152"/>
