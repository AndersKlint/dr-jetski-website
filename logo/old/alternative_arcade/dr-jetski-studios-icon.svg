<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="drj-icon-title drj-icon-description">
  <title id="drj-icon-title">Dr. Jetski Studios — Dr.J square icon</title>
  <desc id="drj-icon-description">Copper Dr. and parchment J in forward-leaning arcade lettering behind muted blue water with warm ivory foam, and the J stem with its lower shading comes forward over the wave with a small crest breaking on the right.</desc>
  <defs>
    <path id="drj-d" fill-rule="evenodd" d="m 14,35 h 80 q 82,0 82,81 v 63 q 0,81 -82,81 H 0 V 49 Q 0,35 14,35 Z m 46,55 v 115 h 24 q 32,0 32,-34 V 125 Q 116,90 84,90 Z"/>
    <path id="drj-r" d="M 195,260 V 111 q 0,-12 12,-12 h 43 v 24 q 22,-29 55,-23 l -10,57 q -30,-7 -45,19 v 84 z"/>
    <path id="drj-j" d="m 420,0 h 162 v 177 q 0,97 -93,97 -80,0 -88,-69 l -2,-18 h 64 l 2,13 q 3,21 23,21 26,0 26,-32 V 58 h -94 z"/>
    <g id="drj-doctor">
      <use href="#drj-d"/>
      <use href="#drj-r" transform="translate(45 78) scale(.74 .7)"/>
      <rect x="282" y="207" width="53" height="53" rx="10"/>
    </g>
    <g id="drj-lettering">
      <use href="#drj-doctor"/>
      <use href="#drj-j" transform="translate(-67 0)"/>
    </g>
    <clipPath id="drj-j-clip">
      <path d="m 420,0 h 162 v 177 q 0,97 -93,97 -80,0 -88,-69 l -2,-18 h 64 l 2,13 q 3,21 23,21 26,0 26,-32 V 58 h -94 z"/>
    </clipPath>
