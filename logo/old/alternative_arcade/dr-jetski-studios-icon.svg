        <path fill="#435f74" d="M200,378 Q300,388 380,386 Q430,384 460,368 Q440,390 380,398 Q280,400 200,388 Z"/>
        <path fill="#f2dab6" d="M90,368 Q180,376 260,368 Q200,380 130,380 Z"/>
        <path fill="#f2dab6" d="M300,376 Q360,380 410,376 Q360,386 310,384 Z"/>
      </g>
      <path fill="#f2dab6" d="M459,301 Q480,321 466,349 L480,344 Q473,366 447,374 Q469,345 465,324 Z"/>
    </g>
    <g transform="translate(60 80) skewX(-8) scale(.83 1.05)" stroke-linejoin="round" stroke-linecap="round">
      <g id="drj-j-front" inkscape:groupmode="layer" inkscape:label="J foreground">
        <g transform="translate(-67 0)">
          <path fill="#1b1612" d="M 580,258 C 580,258 568,278 534,291 C 498,305 451,301 425,288 C 397,275 387,246 387,246 L 424,255 L 564,263 Z"/>
