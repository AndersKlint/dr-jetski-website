  <title id="logo-title">Dr. Jetski Studios</title>
  <desc id="logo-description">Bold forward-leaning copper and warm-gold lettering with flat faces and dark outlines skims through a two-tone blue wake with cream foam. Dr. Je sits in front of the water, while a small wave splashes against the t. A small Studios signature overlaps the lower portion of ki.</desc>
