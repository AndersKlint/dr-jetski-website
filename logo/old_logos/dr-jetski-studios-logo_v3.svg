  <title id="logo-title">Dr. Jetski Studios</title>
  <desc id="logo-description">Coral and buttery-yellow arcade lettering leans forward through turquoise ocean water. A small white-tipped crest breaks on the right, with a low wake trailing left. Studios appears in small cream italic lettering beneath Jetski.</desc>
