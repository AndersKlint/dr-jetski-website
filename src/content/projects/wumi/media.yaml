project-color: "#6EAA7B"
mobile-preview: [wumi-generate-import.png, wumi-study-back.png]
items:
  - preview: wumi-generate-import.png
    text: "Take a photo of your workbook's vocabulary list to auto-generate high quality flashcards."

  - media: wumi-study-back.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "The answer side of a Chinese idiom flashcard with pinyin, an English meaning, translated example sentences and four review ratings."
    text: "Auto-generate powerful flashcards from single words or phrases"
    highlighted-words: "Auto-generate, flashcards, words, phrases"

  - media: wumi-generate-import.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Generate Cards screen with a vocabulary-list photo, camera, image, PDF and text input options, and optional extra context."
    text: "Use a picture of your vocabulary list to generate tens of flashcards in seconds"
    highlighted-words: "picture, vocabulary list, in seconds"

  - media: wumi-review-generated.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Review Cards screen showing a generated card for rose with pinyin, meaning and example sentences, selection and editing controls, and Add to Deck."
    text: "Quickly review generated cards before adding them"
    highlighted-words: "Review, generated cards"

  - media: wumi-deck-details.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Deck details showing review, new, learning and mature card counts, with Study, Generate Cards and Browse Cards actions."
    text: "Study efficiently with spaced repetition"
    highlighted-words: "efficiently, spaced repetition"

  - media: wumi-main.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "wumi's My Decks screen showing Chinese vocabulary decks, colored card counts and a deck group."
    text: "Organize your vocabulary into decks and groups"
    highlighted-words: "Organize, decks, groups"

  - media: wumi-edit-card.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Edit Card form with fields for Chinese characters, pinyin, meaning, native meaning and description, plus Cancel and Save buttons."
    text: "Edit flashcards with ease"
    highlighted-words: "edit, ease"

  - media: wumi-customize-spaced-repetition.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Scheduling Options with daily limits for new, review and learning cards, and configurable learning-step delays."
    text: "Set your own study pace"
    highlighted-words: "study pace"

  - media: wumi-customize-card-layout.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Flashcard Layout settings for the back of a card, with reorder handles, color controls and visibility checkboxes for its fields."
    text: "Customize your flashcard layout"
    highlighted-words: "Customize, layout"

  - media: wumi-card-browser.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Card browser spanning two decks with selected vocabulary cards and an open menu offering Custom Study, Copy to deck and Move to deck."
    text: "Easily manage cards in the card browser"
    highlighted-words: "easily, card browser"

  - media: wumi-dark-mode.png
    crop: { xStart: 0, xEnd: 1, yStart: 0.04, yEnd: 1 }
    alt: "Dark-mode study screen showing the front of a Chinese flashcard with white characters, a green accent and colored card counts."
    text: "Choose between light and dark mode"
    highlighted-words: "light, dark mode"
